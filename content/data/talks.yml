- year: 2018
  talks:
    - title: High-Performance TensorFlow for Accelerators
      venue: Tensorflow Roadshow, Bengaluru, October 2018
      url: https://events.withgoogle.com/tfr-blr/
      description: Talk about the Tensor Processing Units (TPUs). Covers the internals of the hardware design of TPUs, how to run your Tensorflow models on accelerators and performance tuning for your models when using Accelerators.
    - title: Museum of Machine Arts
      venue: PyBay, August 2018
      url: https://pybay.com/
      description: Talk about recent developments in Deep Learning generated/assisted art. Covering recent papers about GANs, Neural Style transfer, Pix2Pixel etc.
      links:
        - label: Slides
          url: https://speakerdeck.com/sb2nov/museum-of-machine-arts
      also_intro: Presented a similar talk on machine generated art at
      also:
        - venue: Global Big Data Conference, August 2018
          url: http://www.globalbigdataconference.com/santa-clara/6th-annual-global-big-data-conference/schedule-105.html
          links:
            - label: Slides
              url: https://speakerdeck.com/sb2nov/museum-of-machine-arts
    - title: Jeju Deep Learning Camp
      venue: Jeju Deep Learning Camp, July 2018
      url: http://jeju.dlcamp.org/2018/
      description: One of the mentors for the deep learning summer camp in Jeju, Korea. Mentored students on projects across variety of domains such as Reinforcement Learning, Recommendation Systems, Computer Vision and Natural Language Processing.
    - title: New APIs in Tensorflow
      venue: Global Artificial Intelligence Conference, April 2018
      url: http://www.globalbigdataconference.com/seattle/global-artificial-intelligence-conference/event-103.html
      description: Talk about the Tensorflow Eager execution and the Dataset APIs. Covers on how to change your code from using graph mode to eager execution and in the second half covered the datasets api to write performant input pipelines.
      links:
        - label: Slides
          url: https://speakerdeck.com/sb2nov/new-apis-in-tensorflow

