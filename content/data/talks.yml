- year: 2016
  talks:
    - title: Cassandra batch loading for building Data Products
      venue: Cassandra Meetup, July 2016
      url: http://www.meetup.com/DataStax-Cassandra-South-Bay-Users/events/232405279/
      description: Talk about Nostos (batch loading service at Coursera) and some of its use cases in data products such as recommendations, search and prediction models. Covers some of the design choice and tradeoffs made in building Nostos and explains how the system evolved over time.
      links:
        - label: Slides
          url: https://speakerdeck.com/sb2nov/cassandra-batch-loading-for-data-products
        - label: Video
          url: https://www.youtube.com/watch?v=SQBGPX_eYZ0
    - title: Extending our workflow service for use cases beyond ETL
      venue: Big Data Meetup, May 2016
      url: http://www.meetup.com/San-Francisco-AWS-Big-Data-Meetup/events/229638199/
      description: Talk about Dataduct the workflow / ETL service at Coursera and how it is now being used for other use cases beyond just ETL such as machine learning, predictions and bulk loading into cassandra.
      links:
        - label: Slides
          url: https://speakerdeck.com/sb2nov/to-and-fro-from-amazon-redshift

