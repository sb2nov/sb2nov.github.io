# Rendered by /talks, grouped by year (newest first). `links` become (Slides | Video)
# buttons; `also` lists other venues where a similar talk was given.
- year: 2023
  talks:
    - title: AI and Customer Education
      venue: "CELab: The Customer Education Lab Podcast, Nov 2023"
      url: https://celab-the-customer-education-lab.castos.com/episodes/celab-ep-118-sourabh-bajaj-ai-and-customer-education
      description: Conversation about how AI is changing customer education, from automating routine work to capturing knowledge, and the guardrails needed around privacy, data security and bias.
    - title: What Will Generative AI Do for You This Year?
      venue: ATD International Conference & EXPO, May 2023
      url: https://www.td.org/videos/what-will-generative-ai-do-for-you-this-year
      description: Session with Julia Stiglitz and Karie Willyerd on how generative AI can help L&D teams reach more learners through personalized learning, virtual teaching assistants and intelligent tutoring, including a live ChatGPT demo.
      links:
        - label: Video
          url: https://www.td.org/videos/what-will-generative-ai-do-for-you-this-year
    - title: A Primer on ChatGPT and the Generative AI Explosion
      venue: ASU+GSV Summit, April 2023
      url: https://asugsvsummit.com/video/a-primer-on-chatgpt-and-the-generative-ai-explosion
      description: Session with Eran Megiddo (Maximal Learning) introducing generative AI and how it can personalize learning, automate administrative work and support collaboration across K-12, higher education and workforce training.
      links:
        - label: Video
          url: https://asugsvsummit.com/video/a-primer-on-chatgpt-and-the-generative-ai-explosion

