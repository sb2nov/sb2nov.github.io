      years: Jun 2026 - Oct 2026
      highlights:
        - Launched AI Skills Studio, bringing Uplimit's AI teaching to [Handshake](https://joinhandshake.com/) to help people get ready for jobs in the AI economy.
    - title: Co-founder and CTO
      years: Sep 2021 - Jun 2026
      highlights:
        - Co-founded Uplimit to make great teaching available to every learner, and built and led its engineering team.
        - Built an AI tutor that teaches one-on-one, talking with learners in real time, creating interactive lessons, and adapting practice and feedback to how each person learns.
