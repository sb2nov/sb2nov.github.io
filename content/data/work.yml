        - Raised over $19.5M from [Conviction](https://www.conviction.com/), [Greylock](https://greylock.com/), [Cowboy Ventures](https://www.cowboy.vc/), Salesforce Ventures, and others, and led the company's technical strategy through its acquisition by Handshake.

