name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04 # Playwright 1.60 cannot install browsers on ubuntu-latest (26.04)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build static export (what deploys)
        run: pnpm run build:pages

      # The e2e suite covers the distill layout through the unpublished template post.
      - name: Build with drafts for e2e
        run: pnpm run build
        env:
          SHOW_DRAFTS: "1"

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: pnpm run test:e2e --project=chromium
        env:
          SHOW_DRAFTS: "1"
